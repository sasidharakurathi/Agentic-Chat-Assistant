<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Can't reach the assistant</title>
    <!-- Phase 8.6: shown by the service worker (sw.js) when a page can't be
         loaded. Self-contained: nothing else can be fetched from here. -->
    <style>
      :root {
        --paper: #f3f6f4;
        --card: #fcfdfc;
        --ink: #1c2a25;
        --muted: #5b6862;
        --line: #d9dfdc;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #141b18;
          --card: #1a221f;
          --ink: #ebefed;
          --muted: #aab4af;
          --line: #36403c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/24px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        justify-content: center;
        padding: 18vh 16px 48px;
      }
      main {
        width: 100%;
        max-width: 400px;
      }
      h1 {
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
      }
      .muted {
        color: var(--muted);
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 16px;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #steps-text {
        white-space: pre-wrap;
        margin: 0;
      }
      button {
        font: inherit;
        font-weight: 500;
        height: 44px;
        padding: 0 20px;
        border-radius: 8px;
        border: 0;
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach the assistant</h1>
      <p>
        Chat works on the company network only. Connect to the office Wi-Fi, or turn on the company
        VPN, then try again.
      </p>
      <section id="steps" hidden>
        <h2 id="steps-title">From your company</h2>
        <p id="steps-text"></p>
      </section>
      <button id="again" type="button">Try again</button>
      <p class="muted" style="margin-top: 16px">
        You're still signed in, and your conversations are kept on the server.
      </p>
    </main>
    <script>
      // The organisation's own steps, kept by the app on its last visit
      // (lib/offline-help.ts, same key). Text only, never markup.
      try {
        var saved = JSON.parse(localStorage.getItem("as.offlineHelp") || "{}");
        if (typeof saved.steps === "string" && saved.steps.trim()) {
          if (typeof saved.organisation === "string" && saved.organisation) {
            document.getElementById("steps-title").textContent = "From " + saved.organisation;
          }
          document.getElementById("steps-text").textContent = saved.steps;
          document.getElementById("steps").hidden = false;
        }
      } catch (e) {}
      document.getElementById("again").addEventListener("click", function () {
        location.reload();
      });
    </script>
  </body>
</html>
