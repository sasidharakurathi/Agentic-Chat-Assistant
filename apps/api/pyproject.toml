[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistant-studio-api"
version = "0.0.0"
description = "Assistant Studio backend — FastAPI + Anthropic Agent SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "claude-agent-sdk>=0.2.150",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "structlog>=24.4",
    "redis>=5.2",
    "httpx>=0.27",
    "tzdata>=2024.2",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    # CPU-only torch is much smaller than the default CUDA wheel — install with:
    #   pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
    "sentence-transformers>=3.3",
    "arq>=0.26",
    "trafilatura>=1.12",
    # Phase 3 — database integrations
    "cryptography>=43.0",   # AESGCM envelope encryption for stored credentials
    "sqlglot>=25.0",        # SQL parsing/classification for the query guard
    "aiomysql>=0.2",
    "motor>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
]
observability = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL", "RUF", "ASYNC", "TID"]
ignore = [
    "PLR0913",  # many args (FastAPI dependency injection)
    "PLR0917",  # many positional args
    "PLC0415",  # deliberate lazy imports (optional deps, avoiding cycles)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0207", "PLW1510"]
"app/db/migrations/**" = ["E501", "I001", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "."
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*", "alembic.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "boto3.*", "botocore.*", "aiomysql.*", "motor.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need real infra not always available locally — Postgres/Redis, MinIO, or a large local-model download (deselect with -m 'not integration')",
]
