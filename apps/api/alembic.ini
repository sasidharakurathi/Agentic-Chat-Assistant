# Alembic config. The DB URL is injected from app.config at runtime (see env.py),
# so sqlalchemy.url is intentionally left blank here.

[alembic]
# %(here)s = the directory of this ini file, so alembic works from any CWD
# (e.g. `alembic -c apps/api/alembic.ini upgrade head` from the repo root).
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
path_separator = os
timezone = UTC
sqlalchemy.url =

# Format new revisions yourself with `just fmt` (or `ruff format apps/api`).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
