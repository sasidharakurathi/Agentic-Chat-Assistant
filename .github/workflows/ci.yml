name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy app scripts

      - name: Pytest
        env:
          APP_ENV: test
          JWT_SECRET: ci-secret-value-that-is-definitely-long-enough
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: pytest -q -m "not integration"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck -w web

      - name: Lint
        run: npm run lint -w web

      - name: Build
        run: npm run build -w web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: npm audit (high)
        run: npm audit --audit-level=high || true
