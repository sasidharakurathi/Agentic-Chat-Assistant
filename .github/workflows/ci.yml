name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, for the retrieval tier: it downloads the local models, so it
  # stays off pull requests (Phase 7b.9).
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # CPU-only torch, as in docker/api.Dockerfile: the default wheel pulls
        # the multi-GB CUDA build that nothing here uses. The image's exact
        # versions (constraints.txt), so CI tests and audits what ships.
        run: |
          python -m pip install -U pip
          pip install -c constraints.txt -e ".[dev,observability]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy app scripts

      # Includes the contract tests: `alembic check` against a migrated SQLite
      # database, and the OpenAPI snapshot the web app's types come from.
      - name: Pytest
        env:
          APP_ENV: test
          JWT_SECRET: ci-secret-value-that-is-definitely-long-enough
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: pytest -q -m "not integration"

      # The eval regression gate (task 6.2), again on its own so a red build
      # says which it was: a 15-case suite on a fixture assistant, with a
      # canned model and everything else real. Fails when a metric falls
      # below app/evals/fixtures/regression_baseline.json.
      - name: Eval regression gate
        env:
          APP_ENV: test
          JWT_SECRET: ci-secret-value-that-is-definitely-long-enough
          DATABASE_URL: sqlite+aiosqlite:///./ci-gate.db
        run: pytest -q tests/test_eval_gate.py

      # No `|| true`: an advisory against a dependency fails the build. It
      # used to be informational, so a critical CVE never turned CI red.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off

  # The integration tier (Phase 7b.9): until now it ran only in
  # scripts/check.ps1 at the end of a phase, so the Postgres-only SQL
  # (pgvector, full-text, the audit trigger) and the Redis paths (approvals
  # across processes, turns, rate limits) went untested on every pull
  # request. The datastores are the repo's own compose services, with the
  # same ports and credentials as development. REQUIRE_INTEGRATION turns a
  # test that can't reach one into a failure, not a quiet skip.
  api-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      JWT_SECRET: ci-secret-value-that-is-definitely-long-enough
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://app:app@localhost:45432/app
      REDIS_URL: redis://localhost:46379/0
      REQUIRE_INTEGRATION: postgres,redis,mysql,mongodb
    steps:
      - uses: actions/checkout@v4

      - name: Start the datastores
        working-directory: .
        # MinIO comes up through its bucket job: `run` waits on the
        # one-shot owner fix and the health check, where `up --wait` would
        # count the finished one-shot as a failure.
        run: |
          docker compose --profile datastores up -d --wait postgres redis mysql mongo
          docker compose run --rm minio-init

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -c constraints.txt -e ".[dev,observability]" --extra-index-url https://download.pytorch.org/whl/cpu

      # The Postgres side of the models-vs-migrations check: only here do
      # the pgvector HNSW and GIN indexes exist.
      - name: Migrate Postgres, and check the models agree
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:45432/app
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Pytest (integration)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-integration.db
        run: pytest -q -m "integration and not local_models"

      - name: Datastore logs
        if: failure()
        working-directory: .
        run: docker compose --profile datastores logs --tail 80 postgres redis minio mysql mongo

  # Retrieval with the real local embedder and reranker: permission-filtered
  # search lives in this SQL, and a stand-in model can't show it ranks the
  # right chunk. Nightly and on main, with the models cached between runs.
  api-retrieval:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      JWT_SECRET: ci-secret-value-that-is-definitely-long-enough
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://app:app@localhost:45432/app
      REDIS_URL: redis://localhost:46379/0
      REQUIRE_INTEGRATION: postgres,models
    steps:
      - uses: actions/checkout@v4

      - name: Start the datastores
        working-directory: .
        run: |
          docker compose up -d --wait postgres redis
          docker compose run --rm minio-init

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -c constraints.txt -e ".[dev,observability]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache the local models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('apps/api/app/rag/embedders/local_bge.py', 'apps/api/app/rag/rerankers/local.py') }}

      - name: Migrate Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:45432/app
        run: python -m alembic upgrade head

      - name: Pytest (retrieval, local models)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-retrieval.db
        run: pytest -q -m local_models

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # packages/shared was never installed, linted or type-checked by any
      # runner. It now holds the generated API types, so it is checked first:
      # the types must match the committed schema, and compile.
      - name: Shared types are up to date
        run: npm run gen:check -w @assistant-studio/shared

      - name: Shared typecheck
        run: npm run typecheck -w @assistant-studio/shared

      - name: Typecheck
        run: npm run typecheck -w web

      - name: Lint
        run: npm run lint -w web

      - name: Unit tests
        run: npm run test -w web

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build -w web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: npm audit (high)
        run: npm audit --audit-level=high

  # The employee flows in a real browser (Phase 8.11): the checks that only
  # show in a page. Playwright starts its own API (SQLite, the fake driver)
  # and web app, and seeds them; nothing here spends.
  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the API
        working-directory: apps/api
        run: |
          python -m venv ../../.venv
          ../../.venv/bin/python -m pip install -U pip
          ../../.venv/bin/pip install -c constraints.txt -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Browser tests
        run: npm run e2e -w web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_REDIS_URL: redis://127.0.0.1:6379/15

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The images were never built by anything, so a broken Dockerfile could sit
  # undetected until someone tried to deploy. Build all three, then prove each
  # one actually starts: build success alone says nothing about the entrypoint.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          tags: assistant-studio-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          tags: assistant-studio-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build MCP runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp-runner.Dockerfile
          tags: assistant-studio-mcp-runner:ci
          load: true
          push: false
          cache-from: type=gha,scope=mcp-runner
          cache-to: type=gha,mode=max,scope=mcp-runner

      # The proxy for an internal install (Phase 8.2): Caddy with the DNS
      # plugins. Built here so a plugin that stops building is seen before
      # an operator's monthly rebuild.
      - name: Build the proxy image
        uses: docker/build-push-action@v6
        with:
          context: deploy/proxy
          file: deploy/proxy/caddy.Dockerfile
          tags: assistant-studio-proxy:ci
          load: true
          push: false
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      # Each way of getting a certificate must at least parse: a typo in a
      # snippet only one TLS_MODE uses would otherwise wait for that install.
      - name: The Caddyfile parses in every TLS mode
        run: |
          for mode in public local cloudflare acmedns; do
            docker run --rm \
              -e SITE_ADDRESS=assistant.example.com -e S3_BUCKET=assistant-uploads \
              -e TLS_MODE=$mode -e CLOUDFLARE_API_TOKEN=ci-token \
              -e ACMEDNS_USERNAME=ci -e ACMEDNS_PASSWORD=ci -e ACMEDNS_SUBDOMAIN=ci \
              -e ACMEDNS_SERVER_URL=https://auth.acme-dns.io \
              -v "$PWD/deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              assistant-studio-proxy:ci \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile || exit 1
          done

      # Run it the way docker-compose.yml does (internal-only network,
      # read-only, no capabilities, no privilege escalation) and prove, from
      # inside, that a server started through it gets every limit, none of
      # the runner's environment, a private directory and no internet.
      - name: Sandbox-test the MCP runner image
        run: |
          docker network create --internal mcp-ci
          docker run -d --name mcp-runner --network mcp-ci --read-only \
            --tmpfs /tmp:size=512m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 512 --memory 2g \
            -e MCP_RUNNER_TOKEN=ci-runner-token-0123456789 -e MCP_RUNNER_NETWORK=none \
            -v "$PWD/apps/api/tests/fixtures:/fixtures:ro" \
            assistant-studio-mcp-runner:ci
          sleep 3
          docker exec mcp-runner python /fixtures/runner_probe.py || { docker logs mcp-runner; exit 1; }

      - name: Smoke-test the web image
        run: |
          docker run -d --name web -p 3000:3000 assistant-studio-web:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          docker logs web
          exit 1

      # Liveness only, with no database or Redis: /healthz must come up on its
      # own (the Redis listeners degrade to retrying, by design).
      - name: Smoke-test the API image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e RUN_MIGRATIONS=0 \
            -e JWT_SECRET=ci-secret-value-that-is-definitely-long-enough \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db \
            assistant-studio-api:ci
          for i in $(seq 1 45); do
            curl -fsS -o /dev/null http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs api
          exit 1
