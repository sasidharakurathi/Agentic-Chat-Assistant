# Base stack.
#   docker compose up -d                     -> datastores only (postgres, redis, minio)
#   docker compose --profile apps up -d      -> also build + run api + web
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d
#                                            -> add the optional Langfuse stack (task 1.9)
#
# This file is for development. For a server, use docker-compose.prod.yml.

name: assistant-studio

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  # Where the *browser* reaches MinIO. Citation deep links are presigned
  # URLs opened by the user's browser, which cannot resolve the compose
  # hostname `minio` - and the host is signed, so it can't be rewritten
  # afterwards. Tracks MINIO_PORT, since that is what compose publishes.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
  S3_BUCKET: ${S3_BUCKET:-assistant-uploads}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
  APP_KEK: ${APP_KEK:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # Tracing (task 1.9); all optional. The containers reach Langfuse by its
  # compose name, not the localhost URL a host-run API uses, so the docker
  # value is its own variable.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  LANGFUSE_HOST: ${LANGFUSE_DOCKER_HOST:-${LANGFUSE_HOST:-}}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  # Local-command MCP servers run in the mcp-runner container (task 4.4).
  MCP_RUNNER_URL: http://mcp-runner:8100
  MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Host port 45432: not 5432 (a locally-installed Postgres has it), and below
    # 49152 on purpose. Windows' dynamic range is 49152-65535, and Hyper-V/WinNAT
    # reserves random blocks of it at every boot. 55432 was used until one reboot
    # reserved 55407-55506 and Postgres could no longer start. All the datastore
    # host ports here stay under 49152 for the same reason.
    ports:
      - "${POSTGRES_PORT:-45432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-46379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Chainguard's MinIO runs as uid 65532, not root (Phase 7a.6). A volume
  # written by the old minio/minio image is root's, so hand it over once,
  # before the server starts; a volume that is already 65532's is left alone.
  minio-owner:
    image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
    user: "0"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - miniodata:/data
    entrypoint: ["/bin/sh", "-c", "[ \"$$(stat -c %u /data)\" = 65532 ] || chown -R 65532:65532 /data"]
    restart: "no"

  minio:
    # Chainguard's build, rebuilt from source daily (Phase 7a.6): MinIO no
    # longer publishes images and its code is archived. Pinned by digest;
    # it carries `mc` and a shell, which the bucket job and backups use.
    image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
    depends_on:
      minio-owner:
        condition: service_completed_successfully
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    # The server image, which carries `mc` too: one image to have and pin.
    image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-assistant-uploads} &&
      echo 'bucket ready'
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["apps"]
    environment:
      <<: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    # `default` for the datastores and the web; `mcp` to reach the runner.
    networks: [default, mcp]
    # The CLI's transcripts and working directories, shared with the
    # worker (Phase 7a.5).
    volumes:
      - agentstate:/var/lib/assistant-studio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs app/worker.py's Arq jobs (currently just data-source ingestion,
  # task 2.5). Same image as `api`, different command — migrations already
  # run there, so skip them here to avoid a redundant race on startup.
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["apps"]
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "0"
    networks: [default, mcp]
    volumes:
      - agentstate:/var/lib/assistant-studio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Runs local-command (stdio) MCP servers, so untrusted code never runs in
  # the api container, which holds APP_KEK and every credential (task 4.4).
  # This container holds none of them: only its own token. It is locked
  # down at the container level:
  #   - no route out: the `mcp` network is internal, so servers can reach the
  #     api's side of the bridge and nothing else. That also means `npx`
  #     cannot download a package at runtime; see docs/EXPLAINER.md §10.6;
  #   - non-root, read-only filesystem, a size-capped /tmp for each server's
  #     private directory, every Linux capability dropped, no privilege
  #     escalation, and caps on processes, memory and CPU for the container
  #     as a whole. Each server gets its own limits on top (app/mcp/jail.py).
  mcp-runner:
    build:
      context: .
      dockerfile: docker/mcp-runner.Dockerfile
    profiles: ["apps"]
    environment:
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-}
      MCP_RUNNER_NETWORK: none
    networks: [mcp]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # A build argument, not an environment variable: Next bakes
      # NEXT_PUBLIC_* into the browser bundle when the image is built, so
      # setting it on the running container changed nothing.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    profiles: ["apps"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Extra engines for Phase 3 integration tests. Opt-in so a normal
  # `docker compose up -d postgres redis minio` stays small:
  #   docker compose --profile datastores up -d mysql mongo
  mysql:
    image: mysql:8.4
    profiles: ["datastores"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "${MYSQL_PORT:-43306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysqldata:/var/lib/mysql

  mongo:
    image: mongo:7
    profiles: ["datastores"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpw}
    ports:
      - "${MONGO_PORT:-47017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongodata:/data/db

networks:
  default: {}
  # The runner's only network. `internal` means no route to the outside.
  mcp:
    internal: true

volumes:
  agentstate:
  mysqldata:
  mongodata:
  pgdata:
  redisdata:
  miniodata:
